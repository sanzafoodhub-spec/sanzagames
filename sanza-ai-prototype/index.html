<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SanZa AI — Private Prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f3ee;background:#0c0d10;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(0px,2vw,24px)}
.app{width:min(900px,100%);height:min(900px,96dvh);min-height:460px;display:flex;flex-direction:column;background:#15161b;border:1px solid #34302a;border-radius:24px;overflow:hidden;box-shadow:0 18px 70px #0008}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;background:#1c1b1b;border-bottom:1px solid #34302a}
.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f8d879,#ac7b21);color:#1c160b;font-size:25px;font-weight:900}
h1{margin:0;color:#f5d57c;font-size:22px;letter-spacing:-.6px}small{color:#aaa9a7;font-size:12px}.newchat{padding:10px 13px;background:#28251e;color:#f5d57c;border:1px solid #6b5832;font-size:13px;white-space:nowrap}
.messages{flex:1;min-height:0;overflow-y:auto;padding:26px 24px;scroll-behavior:smooth}
.turn{display:flex;align-items:flex-start;gap:11px;margin:0 0 23px}.turn.user-turn{justify-content:flex-end}
.avatar{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#3b3020;color:#f5d57c;font-size:16px;font-weight:800}
.bubble{max-width:min(680px,88%);padding:15px 18px;border:1px solid #393b42;border-radius:6px 18px 18px 18px;background:#22242a;color:#f3f3f4;line-height:1.65;font-size:15px;overflow-wrap:anywhere}
.user{background:#3c311f;border-color:#6e5529;color:#fff5dc;border-radius:18px 18px 6px 18px}
.answer{white-space:pre-wrap}.answer p{margin:0 0 12px}.answer p:last-child{margin-bottom:0}.answer strong{color:#ffe09a}.answer ul,.answer ol{padding-left:22px;margin:9px 0}.answer li{margin:5px 0}.answer code{background:#37383e;padding:2px 5px;border-radius:5px;font-size:.9em}
.provider{display:block;margin-top:14px;padding-top:9px;border-top:1px solid #ffffff1a;font-size:11px;color:#d9bd77;font-weight:600;letter-spacing:.2px}
.composer{display:flex;align-items:center;gap:10px;padding:17px 22px;border-top:1px solid #34302a;background:#1b1b20}
input{flex:1;min-width:0;border:1px solid #454249;background:#101116;color:#fff;border-radius:14px;padding:15px 16px;font:inherit;outline:none}input:focus{border-color:#e3bd67;box-shadow:0 0 0 3px #e3bd6722}
button{cursor:pointer;border:0;border-radius:12px;background:#f5cf73;color:#17140d;font-weight:750;padding:13px 19px;font:inherit}button:hover:not(:disabled){filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
footer{padding:0 22px 14px;background:#1b1b20;color:#99989d;font-size:11px;line-height:1.5}
@media(max-width:600px){body{padding:0}.app{height:100dvh;min-height:0;border:0;border-radius:0}header{padding:14px 15px}.mark{width:38px;height:38px}h1{font-size:19px}small{font-size:10px}.newchat{padding:9px;font-size:12px}.messages{padding:20px 12px}.bubble{max-width:calc(100vw - 68px);font-size:14px;padding:12px 14px}.composer{padding:12px}input{padding:13px}button{padding:12px}footer{padding:0 12px 12px}}
@media(prefers-reduced-motion:reduce){.messages{scroll-behavior:auto}}
</style></head>
<body><main class="app"><header><div class="brand"><div class="mark" aria-hidden="true">✦</div><div><h1>SanZa AI</h1><small>One SanZa. One Family. · Private preview</small></div></div><button type="button" class="newchat" id="newchat">＋ New Chat</button></header><section id="messages" class="messages" aria-live="polite" aria-label="Chat conversation"><div class="turn"><div class="avatar" aria-hidden="true">✦</div><div class="bubble">Hey! I'm SanZa, your AI assistant from SanZa Games. ❤️ Ask me anything fun! I remember this open chat.</div></div></section><form class="composer" id="form"><input id="message" maxlength="1000" aria-label="Message" placeholder="Message SanZa AI…" autocomplete="off"><button id="send" type="submit">Send</button></form><footer>Private preview · Memory clears on refresh or New Chat · Please avoid personal information.</footer></main>

<script>
(() => {
 const form=document.getElementById("form"), input=document.getElementById("message"), button=document.getElementById("send"), log=document.getElementById("messages");
 let busy=false;
 let history=[]; // Memory lives only in this open page, never localStorage.
 function bubble(value, user=false) {
   const turn=document.createElement("div");turn.className="turn"+(user?" user-turn":"");
   if(!user){const avatar=document.createElement("div");avatar.className="avatar";avatar.setAttribute("aria-hidden","true");avatar.textContent="✦";turn.appendChild(avatar);}
   const el=document.createElement("div");el.className="bubble"+(user?" user":"");el.textContent=value;turn.appendChild(el);log.appendChild(turn);log.scrollTop=log.scrollHeight;return el;
 }
 // Render a small safe subset of Markdown. All text is escaped; no model HTML is injected.
 function renderAnswer(el,value){
   const escape=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
   const inline=t=>escape(t).replace(/\\*\\*(.+?)\\*\\*/g,"<strong>$1</strong>").replace(/\x60([^\x60]+)\x60/g,"<code>$1</code>");
   const lines=value.split(/\\r?\\n/),parts=[];let list=null;
   const close=()=>{if(list){parts.push("</"+list+">");list=null;}};
   for(const line of lines){
     const item=line.match(/^\\s*(?:([-*])|(\\d+)\\.)\\s+(.+)$/);
     if(item){const kind=item[2]?"ol":"ul";if(list!==kind){close();parts.push("<"+kind+">");list=kind;}parts.push("<li>"+inline(item[3])+"</li>");}
     else{close();if(line.trim())parts.push("<p>"+inline(line)+"</p>");}
   }
   close();el.classList.add("answer");el.innerHTML=parts.join("");
 }
 document.getElementById("newchat").addEventListener("click",()=>{
   if(busy)return;
   history=[];
   log.textContent="";
   bubble("New chat started. Previous conversation cleared. ❤️");
 });
 form.addEventListener("submit",async e=>{
   e.preventDefault();
   const message=input.value.trim();
   if(!message||busy)return;
   busy=true;button.disabled=true;input.disabled=true;
   bubble(message,true);input.value="";
   const pending=bubble("SanZa is checking availability…");
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),15000);
   try {
     const response=await fetch("/api/sanza-ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history}),signal:controller.signal,credentials:"same-origin"});
     const data=await response.json().catch(()=>({}));
     pending.textContent=response.ok?(typeof data.reply==="string"?data.reply:"SanZa couldn't read the response."):(data.error||"SanZa is currently unavailable.");
     if(response.ok && typeof data.reply==="string" && data.reply.trim()) {
       history.push({role:"user",content:message},{role:"assistant",content:data.reply.slice(0,1500)});
       history=history.slice(-12);
     }
     if(response.ok && (data.provider==="gemini" || data.provider==="groq")) {
       const label=document.createElement("span");
       label.className="provider";
       label.textContent="Powered by "+(data.provider==="gemini"?"Gemini":"Groq");
       pending.appendChild(label);
     }
   } catch {pending.textContent="SanZa couldn't connect. Please try later.";}
   finally {clearTimeout(timeout);busy=false;button.disabled=false;input.disabled=false;input.focus();}
 });
})();
</script></body></html>
