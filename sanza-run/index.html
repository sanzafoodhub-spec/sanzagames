<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SanZa Run</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:white;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100%;background:linear-gradient(#111 0%,#222 55%,#080808 100%);overflow:hidden}
#sky{position:absolute;inset:0 0 45%;background:linear-gradient(#050505,#181818)}
#road{position:absolute;left:15%;right:15%;top:35%;bottom:-10%;background:#252525;transform:perspective(400px) rotateX(12deg)}
.lane{position:absolute;top:0;bottom:0;width:4px;background:repeating-linear-gradient(to bottom,#fff 0 35px,transparent 35px 75px);opacity:.45}
.l1{left:33%}.l2{left:66%}
.building{position:absolute;bottom:48%;width:18%;height:28%;background:#161616;border:2px solid #292929}
.b1{left:0}.b2{right:0}
.light{position:absolute;width:5px;height:45%;background:#777;bottom:43%}
.light:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#ffd85a;box-shadow:0 0 22px #ffd85a;top:-5px;left:-11px}
.li1{left:9%}.li2{right:9%}
#player{
 position:absolute;width:58px;height:82px;bottom:13%;left:calc(50% - 29px);
 background:#050505;border:3px solid #fff;border-radius:14px;
 box-shadow:0 0 20px rgba(255,255,255,.2);
 transition:left .15s,bottom .18s;
 z-index:10
}
#player:before{
 content:"SANZA";position:absolute;top:25px;left:5px;right:5px;
 color:#ffd21c;font-weight:900;font-size:12px;text-align:center
}
.obstacle{
 position:absolute;width:58px;height:72px;background:#c92828;border-radius:12px;
 bottom:52%;z-index:5;box-shadow:0 0 15px #000
}
.coin{
 position:absolute;width:28px;height:28px;border-radius:50%;
 background:#ffd21c;color:#111;font-weight:bold;font-size:10px;
 display:flex;align-items:center;justify-content:center;z-index:6;
 box-shadow:0 0 15px #ffd21c
}
#hud{
 position:absolute;top:12px;left:12px;right:12px;z-index:20;
 display:flex;justify-content:space-between;gap:8px
}
.box{
 background:rgba(0,0,0,.72);border:1px solid #333;border-radius:12px;
 padding:9px 12px;font-weight:bold;font-size:14px
}
#message{
 position:absolute;inset:0;z-index:30;display:flex;align-items:center;
 justify-content:center;text-align:center;background:rgba(0,0,0,.75);padding:25px
}
.card{max-width:400px}
h1{font-size:42px;margin:0 0 8px;font-weight:900}
.yellow{color:#ffd21c}
button{
 border:0;border-radius:12px;background:#ffd21c;color:#050505;
 padding:15px 28px;font-size:18px;font-weight:900;margin-top:20px
}
#controls{
 position:absolute;bottom:18px;left:18px;right:18px;z-index:25;
 display:flex;justify-content:space-between;pointer-events:none
}
.ctrl{
 width:74px;height:58px;border:1px solid #555;border-radius:16px;
 background:rgba(0,0,0,.55);color:#fff;font-size:28px;
 display:flex;align-items:center;justify-content:center
}
small{color:#aaa}
</style>
</head>

<body>
<div id="game">

<div id="sky"></div>
<div id="road"></div>
<div class="lane l1"></div>
<div class="lane l2"></div>

<div class="building b1"></div>
<div class="building b2"></div>
<div class="light li1"></div>
<div class="light li2"></div>

<div id="hud">
 <div class="box">🏃 SANZA RUN</div>
 <div class="box">⭐ <span id="score">0</span></div>
 <div class="box">🍪 <span id="drops">0</span>/50</div>
 <div class="box">❤️ <span id="lives">3</span></div>
</div>

<div id="player"></div>

<div id="controls">
 <div class="ctrl">⬅️</div>
 <div class="ctrl">⬆️</div>
 <div class="ctrl">➡️</div>
</div>

<div id="message">
 <div class="card">
  <h1>SANZA <span class="yellow">RUN</span></h1>
  <p><strong>Are you ready Sanzations?</strong></p>
  <p>Finglas → Ballymun</p>
  <p><small>Swipe left/right • Jump • Collect 50 drops</small></p>
  <button onclick="startGame()">3 2 1 GO! 🔥</button>
 </div>
</div>

</div>

<script>
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const dropsEl=document.getElementById("drops");
const livesEl=document.getElementById("lives");
const message=document.getElementById("message");

let lane=1;
let score=0;
let drops=0;
let lives=3;
let running=false;
let speed=7;
let objects=[];
let lastSpawn=0;

const lanes=[
 "23%",
 "calc(50% - 29px)",
 "calc(77% - 58px)"
];

function move(dir){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+dir));
 player.style.left=lanes[lane];
}

function jump(){
 if(!running)return;
 player.style.bottom="28%";
 setTimeout(()=>player.style.bottom="13%",350);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowUp"||e.key===" ")jump();
});

let sx=0,sy=0;
document.addEventListener("touchstart",e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30)move(dx>0?1:-1);
 else if(dy<-30)jump();
},{passive:true});

function spawn(){
 const el=document.createElement("div");
 const isCoin=Math.random()>.35;
 el.className=isCoin?"coin":"obstacle";
 el.textContent=isCoin?"🍪":"🚗";
 el.dataset.lane=Math.floor(Math.random()*3);
 el.style.left=lanes[el.dataset.lane];
 el.style.top="-90px";
 document.getElementById("game").appendChild(el);
 objects.push(el);
}

function hit(a,b){
 const r1=a.getBoundingClientRect();
 const r2=b.getBoundingClientRect();
 return !(r1.right<r2.left||r1.left>r2.right||r1.bottom<r2.top||r1.top>r2.bottom);
}

function gameLoop(time){
 if(!running)return;

 if(time-lastSpawn>650){
   spawn();
   lastSpawn=time;
 }

 objects.forEach((o,i)=>{
   let top=parseFloat(o.style.top)||-90;
   top+=speed;
   o.style.top=top+"px";

   if(top>innerHeight+100){
     o.remove();
     objects.splice(i,1);
     return;
   }

   if(hit(o,player)){
     if(o.classList.contains("coin")){
       drops++;
       score+=10;
       dropsEl.textContent=drops;
       scoreEl.textContent=score;
       o.remove();
       objects.splice(i,1);

       if(drops>=50){
         win();
       }
     }else{
       o.remove();
       objects.splice(i,1);
       lives--;
       livesEl.textContent=lives;

       if(lives<=0)gameOver();
     }
   }
 });

 requestAnimationFrame(gameLoop);
}

function startGame(){
 message.style.display="none";
 running=true;
 lane=1;
 score=0;
 drops=0;
 lives=3;
 scoreEl.textContent=0;
 dropsEl.textContent=0;
 livesEl.textContent=3;
 player.style.left=lanes[1];
 player.style.bottom="13%";
 objects.forEach(o=>o.remove());
 objects=[];
 lastSpawn=performance.now();
 requestAnimationFrame(gameLoop);
}

function gameOver(){
 running=false;
 message.style.display="flex";
 message.innerHTML=`
 <div class="card">
  <h1>GAME <span class="yellow">OVER</span></h1>
  <p>Score: <strong>${score}</strong></p>
  <p>Drops: <strong>${drops}/50</strong></p>
  <button onclick="startGame()">RUN AGAIN 🔥</button>
 </div>`;
}

function win(){
 running=false;
 message.style.display="flex";
 message.innerHTML=`
 <div class="card">
  <h1>YOU <span class="yellow">MADE IT!</span> 🎉</h1>
  <p>Welcome to Ballymun, my Sanzations!</p>
  <p><strong>50 drops collected!</strong></p>
  <p>🎁 Your SanZa 10% OFF reward is unlocked.</p>
  <button onclick="startGame()">RUN AGAIN</button>
 </div>`;
}
</script>
</body>
</html>
