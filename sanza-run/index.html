<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SANZA RUN</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#050505;color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 touch-action:none
}

#game{
 position:relative;width:100vw;height:100vh;overflow:hidden;
 background:linear-gradient(#030303 0%,#101722 38%,#252525 60%,#111 100%)
}

/* SKY */
.skyGlow{
 position:absolute;width:100%;height:45%;
 background:
 radial-gradient(circle at 50% 70%,rgba(255,210,30,.16),transparent 35%),
 linear-gradient(180deg,#020202,#10131b 65%,#20252b)
}

.moon{
 position:absolute;right:12%;top:9%;
 width:55px;height:55px;border-radius:50%;
 background:#eee;
 box-shadow:0 0 30px rgba(255,255,255,.35)
}

/* CITY */
.city{
 position:absolute;left:0;right:0;bottom:43%;
 height:27%;
 display:flex;align-items:flex-end;gap:5px;
 opacity:.95
}

.building{
 flex:1;
 background:linear-gradient(90deg,#101318,#242930,#0c0f13);
 border-top:2px solid #343941;
 position:relative
}

.building:after{
 content:"";
 position:absolute;inset:10px;
 background:
 repeating-linear-gradient(90deg,transparent 0 14px,#ffd84a 15px 18px,transparent 19px 32px),
 repeating-linear-gradient(0deg,transparent 0 17px,rgba(255,255,255,.08) 18px 21px);
 opacity:.5
}

.b1{height:62%}.b2{height:83%}.b3{height:50%}.b4{height:72%}
.b5{height:92%}.b6{height:57%}.b7{height:76%}

/* ROAD */
.road{
 position:absolute;
 left:-12%;right:-12%;
 top:42%;bottom:-20%;
 background:
 linear-gradient(90deg,#111 0%,#252525 18%,#303030 50%,#252525 82%,#111 100%);
 clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);
}

.road:before,.road:after{
 content:"";position:absolute;top:0;bottom:0;width:7px;
 background:repeating-linear-gradient(
  to bottom,#fff 0 38px,transparent 38px 78px
 );
 opacity:.5
}
.road:before{left:42%}
.road:after{right:42%}

.edge{
 position:absolute;top:42%;bottom:0;width:5px;background:#ffd21c;
 opacity:.5
}
.edge.left{left:20%}.edge.right{right:20%}

/* STREET LIGHTS */
.lamp{
 position:absolute;bottom:43%;width:5px;height:29%;
 background:#666
}
.lamp:after{
 content:"";position:absolute;top:-7px;left:-9px;
 width:22px;height:22px;border-radius:50%;
 background:#ffd21c;
 box-shadow:0 0 28px 10px rgba(255,210,30,.25)
}
.lamp.l{left:10%}.lamp.r{right:10%}

/* HUD */
#hud{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:6px;
 z-index:50
}
.stat{
 background:rgba(0,0,0,.75);
 border:1px solid #3c3c3c;
 border-radius:13px;
 padding:8px 11px;
 font-size:13px;font-weight:900;
 backdrop-filter:blur(5px)
}
.yellow{color:#ffd21c}

/* PLAYER */
#player{
 position:absolute;
 left:calc(50% - 30px);
 bottom:14%;
 width:60px;height:92px;
 z-index:30;
 transition:left .16s,bottom .22s;
}

.body{
 position:absolute;left:10px;top:28px;
 width:40px;height:52px;
 background:#090909;
 border:2px solid #fff;
 border-radius:13px
}

.body:before{
 content:"SANZA";
 position:absolute;top:16px;left:2px;right:2px;
 color:#ffd21c;text-align:center;
 font-size:11px;font-weight:1000
}

.head{
 position:absolute;left:17px;top:0;
 width:27px;height:30px;border-radius:50%;
 background:#b97855;border:2px solid #111
}

.head:after{
 content:"";
 position:absolute;left:-2px;top:-3px;
 width:28px;height:12px;
 border-radius:15px 15px 5px 5px;
 background:#111
}

.leg{
 position:absolute;top:74px;width:11px;height:22px;
 background:#111;border-radius:5px
}
.leg.one{left:14px}.leg.two{right:14px}

/* OBJECTS */
.object{
 position:absolute;z-index:25;
 transform:translateZ(0)
}

.car{
 width:62px;height:82px;
 border-radius:12px;
 background:linear-gradient(90deg,#7b1111,#ed2929,#7b1111);
 border:2px solid #111;
 box-shadow:0 8px 15px #000
}
.car:before{
 content:"";
 position:absolute;left:10px;right:10px;top:12px;height:25px;
 background:#151a20;border-radius:7px
}
.car:after{
 content:"";
 position:absolute;left:5px;right:5px;bottom:7px;height:7px;
 background:#ffdf45;border-radius:5px
}

.scooter{
 width:62px;height:70px;
 color:#ffd21c;font-size:34px;
 text-align:center
}
.scooter:after{
 content:"YUPBRO";
 display:block;
 color:#fff;font-size:9px;font-weight:1000
}

.drop{
 width:34px;height:34px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff5a0,#ffd21c 40%,#d79600);
 border:2px solid #fff;
 box-shadow:0 0 18px rgba(255,210,30,.8);
 display:flex;align-items:center;justify-content:center;
 font-size:16px
}

/* BANNERS */
.banner{
 position:absolute;
 z-index:12;
 top:36%;
 padding:6px 10px;
 background:#050505;
 border:1px solid #ffd21c;
 color:#ffd21c;
 font-weight:1000;
 font-size:10px;
 transform:rotate(-2deg)
}
.banner.a{left:3%}.banner.b{right:3%;transform:rotate(2deg)}

/* EFFECT */
.hit{
 animation:shake .25s
}
@keyframes shake{
 0%{transform:translateX(0)}
 25%{transform:translateX(-10px)}
 50%{transform:translateX(10px)}
 75%{transform:translateX(-7px)}
 100%{transform:translateX(0)}
}

/* START SCREEN */
#screen{
 position:absolute;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 text-align:center;
 background:rgba(0,0,0,.78);
 padding:25px
}

.card{
 width:min(420px,92vw);
 padding:28px 20px;
 border:1px solid #333;
 border-radius:22px;
 background:linear-gradient(180deg,#111,#050505);
 box-shadow:0 20px 70px #000
}

.logo{
 font-size:46px;
 font-weight:1000;
 letter-spacing:-3px
}

.logo span{color:#ffd21c}

.subtitle{
 color:#aaa;
 margin:8px 0 22px
}

button{
 width:100%;
 padding:16px;
 border:0;
 border-radius:13px;
 background:#ffd21c;
 color:#050505;
 font-size:19px;
 font-weight:1000
}

.hint{
 margin-top:15px;
 color:#777;
 font-size:12px
}

/* CONTROLS */
#controls{
 position:absolute;
 bottom:15px;left:15px;right:15px;
 z-index:60;
 display:flex;justify-content:space-between;
 pointer-events:none
}
.control{
 width:62px;height:55px;
 border:1px solid #555;
 border-radius:16px;
 background:rgba(0,0,0,.48);
 display:flex;align-items:center;justify-content:center;
 font-size:25px
}
</style>
</head>

<body>

<div id="game">

<div class="skyGlow"></div>
<div class="moon"></div>

<div class="city">
 <div class="building b1"></div>
 <div class="building b2"></div>
 <div class="building b3"></div>
 <div class="building b4"></div>
 <div class="building b5"></div>
 <div class="building b6"></div>
 <div class="building b7"></div>
</div>

<div class="lamp l"></div>
<div class="lamp r"></div>

<div class="road"></div>
<div class="edge left"></div>
<div class="edge right"></div>

<div class="banner a">ORDER SANZA AT</div>
<div class="banner b">WWW.SANZAFOOD.IE</div>

<div id="hud">
 <div class="stat">🏃 <span class="yellow">SANZA</span></div>
 <div class="stat">⭐ <span id="score">0</span></div>
 <div class="stat">🍪 <span id="drops">0</span>/50</div>
 <div class="stat">❤️ <span id="lives">3</span></div>
</div>

<div id="player">
 <div class="head"></div>
 <div class="body"></div>
 <div class="leg one"></div>
 <div class="leg two"></div>
</div>

<div id="controls">
 <div class="control">⬅</div>
 <div class="control">⬆</div>
 <div class="control">➡</div>
</div>

<div id="screen">
 <div class="card">
  <div class="logo">SANZA <span>RUN</span></div>
  <div class="subtitle">
   FINGLAS → BALLYMUN
  </div>
  <p>🔥 Are you ready Sanzations?</p>
  <p>Collect <strong>50 drops</strong> and unlock your SanZa reward.</p>
  <button onclick="startGame()">3&nbsp;&nbsp;2&nbsp;&nbsp;1&nbsp;&nbsp;GO! 🚀</button>
  <div class="hint">Swipe ← → to move • Swipe ↑ to jump</div>
 </div>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const screen=document.getElementById("screen");

const scoreEl=document.getElementById("score");
const dropsEl=document.getElementById("drops");
const livesEl=document.getElementById("lives");

let lane=1;
let score=0;
let drops=0;
let lives=3;
let running=false;
let speed=5;
let objects=[];
let lastSpawn=0;
let lastTime=0;
let jumping=false;

const laneX=[
 "22%",
 "calc(50% - 30px)",
 "calc(78% - 60px)"
];

function move(dir){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+dir));
 player.style.left=laneX[lane];
}

function jump(){
 if(!running || jumping)return;

 jumping=true;
 player.style.bottom="29%";

 setTimeout(()=>{
  player.style.bottom="14%";
  setTimeout(()=>jumping=false,180);
 },400);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowUp" || e.key===" ")jump();
});

let sx=0,sy=0;

document.addEventListener("touchstart",e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
 if(!running)return;

 const dx=e.changedTouches[0].clientX-sx;
 const dy=e.changedTouches[0].clientY-sy;

 if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>25){
  move(dx>0?1:-1);
 }else if(dy<-25){
  jump();
 }
},{passive:true});

function spawn(){

 const el=document.createElement("div");
 const roll=Math.random();

 if(roll<.48){
  el.className="object drop";
  el.innerHTML="🍪";
  el.dataset.type="drop";
 }else if(roll<.78){
  el.className="object car";
  el.dataset.type="car";
 }else{
  el.className="object scooter";
  el.innerHTML="🛵";
  el.dataset.type="scooter";
 }

 el.dataset.lane=Math.floor(Math.random()*3);

 el.style.left=laneX[el.dataset.lane];
 el.style.top="-100px";

 game.appendChild(el);
 objects.push(el);
}

function collision(a,b){

 const r1=a.getBoundingClientRect();
 const r2=b.getBoundingClientRect();

 return !(
  r1.right<r2.left ||
  r1.left>r2.right ||
  r1.bottom<r2.top ||
  r1.top>r2.bottom
 );
}

function removeObject(o,i){
 o.remove();
 objects.splice(i,1);
}

function loop(time){

 if(!running)return;

 const dt=Math.min(30,time-lastTime);
 lastTime=time;

 if(time-lastSpawn>650){
  spawn();
  lastSpawn=time;
 }

 objects.forEach((o,i)=>{

  let y=parseFloat(o.style.top)||-100;

  y+=speed*(dt/16);

  o.style.top=y+"px";

  if(y>innerHeight+120){
   removeObject(o,i);
   return;
  }

  if(collision(o,player)){

   if(o.dataset.type==="drop"){

    drops++;
    score+=10;

    dropsEl.textContent=drops;
    scoreEl.textContent=score;

    removeObject(o,i);

    if(drops>=50){
     win();
    }

   }else{

    if(!jumping){

     lives--;
     livesEl.textContent=lives;

     player.classList.add("hit");
     setTimeout(()=>player.classList.remove("hit"),250);

     removeObject(o,i);

     if(lives<=0){
      gameOver();
     }
    }
   }
  }
 });

 requestAnimationFrame(loop);
}

function startGame(){

 screen.style.display="none";

 objects.forEach(o=>o.remove());
 objects=[];

 lane=1;
 score=0;
 drops=0;
 lives=3;
 speed=5;

 scoreEl.textContent="0";
 dropsEl.textContent="0";
 livesEl.textContent="3";

 player.style.left=laneX[1];
 player.style.bottom="14%";

 running=true;
 lastSpawn=performance.now();
 lastTime=performance.now();

 requestAnimationFrame(loop);
}

function gameOver(){

 running=false;

 screen.style.display="flex";

 screen.innerHTML=`
 <div class="card">
  <div class="logo">GAME <span>OVER</span></div>
  <p>⭐ Score: <strong>${score}</strong></p>
  <p>🍪 Drops: <strong>${drops}/50</strong></p>
  <button onclick="startGame()">RUN AGAIN 🔥</button>
 </div>`;
}

function win(){

 running=false;

 screen.style.display="flex";

 screen.innerHTML=`
 <div class="card">
  <div class="logo">YOU <span>MADE IT!</span> 🎉</div>
  <p>Welcome to Ballymun, my Sanzations!</p>
  <p>🍪 <strong>50 DROPS COLLECTED!</strong></p>
  <p>🎁 SanZa <strong>10% OFF</strong> unlocked.</p>
  <button onclick="startGame()">RUN AGAIN</button>
 </div>`;
}
</script>

</div>
</body>
</html>
