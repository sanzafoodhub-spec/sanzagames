<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SanZa Chat V2 Moderator Preview</title><style>:root{color-scheme:dark;font-family:system-ui;background:#100f0b;color:#f7e5ad}body{padding:22px}main{max-width:540px;margin:5vh auto;background:#1d1910;border:1px solid #a08238;border-radius:18px;padding:24px}label{display:block;margin-top:14px}input{display:block;box-sizing:border-box;width:100%;padding:13px;margin-top:6px;background:#100f0b;color:white;border:1px solid #8a753e;border-radius:8px;font-size:16px}button{background:#edc358;color:#17120a;border:0;border-radius:9px;padding:13px 18px;margin-top:16px;font-weight:700}li{margin:12px 0;overflow-wrap:anywhere}</style></head><body><main><h1>🛡️ SanZa Chat V2 Moderator</h1><p>Staging preview only. Authorized moderators may view reports, not modify them.</p><form id="form"><label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Moderator sign in</button></form><p id="status" role="status" aria-live="polite"></p><section id="queue" hidden><h2>Recent reports</h2><button id="refresh" type="button">Refresh</button><ul id="reports"></ul><button id="logout" type="button">Sign out</button></section></main><script>"use strict";const form=document.getElementById("form"),status=document.getElementById("status"),queue=document.getElementById("queue"),list=document.getElementById("reports");async function refresh(){list.replaceChildren();status.textContent="Loading reports…";try{const r=await fetch("/api/chat-v2-owner-reports",{cache:"no-store",credentials:"same-origin"});const data=await r.json().catch(()=>({}));if(!r.ok){status.textContent=data.error||"Reports unavailable.";return;}const reports=Array.isArray(data.reports)?data.reports:[];status.textContent=reports.length+" recent reports";for(const item of reports){const li=document.createElement("li");li.textContent=[item.created_at,item.status,item.reason,item.message_excerpt].filter(Boolean).join(" — ");list.append(li);}}catch(_){status.textContent="Unable to load reports.";}}form.addEventListener("submit",async e=>{e.preventDefault();const b=form.querySelector("button");b.disabled=true;status.textContent="Checking login…";try{const r=await fetch("/api/chat-v2-moderator-login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:form.elements.email.value.trim(),password:form.elements.password.value})});if(!r.ok){status.textContent=r.status===429?"Too many attempts. Try later.":r.status===401?"Authentication failed. Check the test email and password.":r.status===403?"Account authenticated but moderator permission was denied, or the request was rejected.":r.status===503?"Staging sign-in service temporarily unavailable.":"Sign-in failed (HTTP "+r.status+").";return;}form.hidden=true;queue.hidden=false;await refresh();}catch(_){status.textContent="Sign-in temporarily unavailable.";}finally{form.elements.password.value="";b.disabled=false;}});document.getElementById("refresh").addEventListener("click",refresh);document.getElementById("logout").addEventListener("click",async()=>{try{const r=await fetch("/api/chat-v2-moderator-logout",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:"{}"});if(!r.ok)throw Error();queue.hidden=true;form.hidden=false;list.replaceChildren();status.textContent="Signed out.";}catch(_){status.textContent="Unable to sign out; retry.";}});</script></body></html>
