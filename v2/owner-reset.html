<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>SanZa Chat V2 | Reset Owner Password</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0d0c0a;color:#f7e6ae}body{min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,430px);background:#19160f;border:1px solid #8e722d;border-radius:18px;padding:26px}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:8px;font-size:16px}input{background:#0e0d0b;color:white;border:1px solid #8e722d}button{background:#e7ba4c;color:#171107;border:0;font-weight:800}p{line-height:1.5}a{color:#f7d47b}</style></head><body><main><h1>👑 Reset Owner password</h1><p>Use the secure recovery link sent to your registered Owner email.</p><form id="reset"><label for="password">New password (12+ characters)</label><input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><button id="submit">Update password</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/v2/owner-login.html">Back to Owner login</a></p></main><script>"use strict";const params=new URLSearchParams(location.hash.slice(1));const token=params.get("access_token"),type=params.get("type");history.replaceState(null,"",location.pathname);const form=document.getElementById("reset"),status=document.getElementById("status");if(!token||type!=="recovery"){form.hidden=true;status.textContent="Invalid recovery link. Request a new password reset from Owner login.";}form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){status.textContent="Passwords do not match.";return;}const button=document.getElementById("submit");button.disabled=true;status.textContent="Updating password…";try{const r=await fetch("/api/chat-v2-owner-reset",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",cache:"no-store",body:JSON.stringify({accessToken:token,password})});const data=await r.json().catch(()=>({}));status.textContent=r.ok?"Password updated. Return to Owner login.":data.error||"Password update failed.";if(r.ok)form.hidden=true;}catch(_){status.textContent="Unable to update password. Please retry.";}finally{document.getElementById("password").value="";document.getElementById("confirm").value="";button.disabled=false;}});</script></body></html>
